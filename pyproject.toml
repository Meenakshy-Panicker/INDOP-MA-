[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indop-ma"
version = "0.1.0"
description = "Multi-node spatial evaluation and multi-agent extension (INDOP-MA) of INDOP, calibration-free spectrum occupancy estimation from raw IQ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["indop", "indop_ma", "sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
