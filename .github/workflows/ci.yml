name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Paper figures build
        run: python scripts/plot_paper_figures.py
      - name: Synthetic campaign smoke test
        run: python scripts/run_multinode_campaign.py --synthetic --minutes 4 --out /tmp/npz
